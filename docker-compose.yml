version: '3.8'

services:
  # -------------------------------------------------------------
  # Backend API, Threat Detection Engine, & Honeypot Listeners
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: honeypot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"   # Administrative REST API & WebSocket Feed
      - "2222:2222"   # Controlled Safe SSH Honeypot
      - "8080:8080"   # Controlled Safe HTTP Honeypot
      - "2121:2121"   # Controlled Safe FTP Honeypot
      - "9999:9999"   # Controlled Safe Generic TCP Listener
    environment:
      - APP_NAME=Honeypot Trap System
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=honey-secret-key-change-in-production-super-safe-32chars
      - DATABASE_URL=sqlite:////app/data/honeypot.db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=adminpassword123
      - SSH_HONEYPOT_ENABLED=true
      - SSH_HONEYPOT_PORT=2222
      - HTTP_HONEYPOT_ENABLED=true
      - HTTP_HONEYPOT_PORT=8080
      - FTP_HONEYPOT_ENABLED=true
      - FTP_HONEYPOT_PORT=2121
      - TCP_HONEYPOT_ENABLED=true
      - TCP_HONEYPOT_PORT=9999
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000"]
    volumes:
      - honeypot_data:/app/data
    networks:
      - honeypot_net

  # -------------------------------------------------------------
  # Frontend SOC Monitoring Dashboard (React + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: honeypot_frontend
    restart: unless-stopped
    ports:
      - "3000:80"     # SOC Monitoring Web Dashboard UI
    depends_on:
      - backend
    networks:
      - honeypot_net

volumes:
  honeypot_data:
    driver: local

networks:
  honeypot_net:
    driver: bridge
